<div class="wrapper">
  <div class="user-info">
    <div [tuiAvatar]="chatAvatar()" class="avatar"></div>

    <div class="data">
      <div class="username" [tuiSkeleton]="isChatLoading()">{{ chatTitle() }}</div>
      <div class="status">В сети</div>
    </div>
  </div>

  <div class="actions">
    <button
      class="button-round"
      tuiButton
      appearance="flat"
      iconStart="@tui.video"
      tuiHint="Видеозвонок"
    ></button>

    <button
      class="button-round"
      tuiButton
      appearance="flat"
      iconStart="@tui.phone"
      tuiHint="Аудиозвонок"
    ></button>

    <button
      class="button-round"
      tuiButton
      appearance="flat"
      iconStart="@tui.search"
      tuiHint="Поиск"
      (click)="openSearch()"
    ></button>

    <app-chat-menu-button />
  </div>
</div>
