<div
  tuiMessage
  class="message"
  [class.message_outgoing]="message().senderId === currentUser()!.id"
  [class.message_incoming]="message().senderId !== currentUser()!.id"
  (tuiHoveredChange)="isHovered.set($event)"
>
  <div class="message__text">
    {{ message().text }}
  </div>

  <div class="message__meta">
    <span class="message__time">
      {{ message().createdAt | date: 'HH:mm' }}
    </span>

    @if (message().senderId === currentUser()!.id) {
      <tui-icon icon="@tui.check" class="message__read-status" />
    }
  </div>

  @if (isActionsButtonsNeeded()) {
    <app-message-actions-button
      class="message__actions"
      [class.message__actions_visible]="isHovered() || isMenuOpen()"
      [(open)]="isMenuOpen"
      [message]="message()"
    />
  }
</div>
