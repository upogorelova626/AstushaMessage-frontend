@let list = messageList();

<div class="wrapper">
  @if (isLoading() && !list) {
    <div class="empty-state">Поиск сообщений с {{ title() }}.</div>
  } @else if (!list) {
    <div class="empty-state">Поиск сообщений с {{ title() }}.</div>
  } @else if (list.items.length === 0) {
    <div class="not-found">Сообщения не найдены</div>
  } @else {
    <div class="search-results">
      @for (message of list.items; track message.id) {
        <app-chat-search-message-item [message]="message" />
      }
    </div>
  }
</div>
