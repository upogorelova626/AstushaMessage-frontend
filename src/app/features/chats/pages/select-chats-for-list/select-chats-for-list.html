<tui-textfield class="textfield">
  <input
    type="text"
    tuiInput
    placeholder="Поиск по имени или названию чата"
    [formControl]="filterInput"
  />
</tui-textfield>

<div class="added-chats">
  @for (chat of addedChats(); track chat.id) {
    <app-selected-chat-chip [chat]="chat" (remove)="toggleChat(chat)" />
  }
</div>

@if (filteredChats().length > 0) {
  <div class="description">Все чаты</div>

  <tui-scrollbar class="scrollbar">
    <div class="items">
      @for (chat of filteredChats(); track chat.id) {
        <button
          tuiButton
          appearance="flat"
          type="button"
          class="chat-item"
          (click)="toggleChat(chat)"
        >
          <input
            type="checkbox"
            tuiCheckbox
            [checked]="addedChats().some((item) => item.id === chat.id)"
          />
          <app-chat-preview [chat]="chat" />
        </button>
      }
    </div>
  </tui-scrollbar>
} @else {
  <div class="empty">
    <img class="image" src="/not-found-chats-img.png" alt="Чаты не найдены" />

    <div class="empty-text">Чаты не найдены</div>
  </div>
}

<button
  type="button"
  tuiButton
  iconStart="@tui.check"
  class="button-round"
  (click)="save()"
></button>
