<button tuiButton appearance="flat" class="chat-item" (click)="openChat(chat().id)">
  <div [tuiAvatar]="chatAvatar()" class="avatar"></div>

  <div class="content">
    <div class="name">{{ chatTitle() }}</div>

    <div class="message-preview">
      <tui-icon class="read-status" icon="@tui.check-check" />
      <div class="last-message">Что то тут написано это последнее сообщение</div>
    </div>
  </div>

  <div class="meta-containers">
    <div class="meta">11:20</div>

    <div class="met">
      @if (chat().settings.isPinned) {
        <tui-icon icon="@tui.pin" class="icon" />
      }

      <app-chat-actions-button class="actions-button" [chat]="chat()" [chatTitle]="chatTitle()" />
    </div>
  </div>
</button>
