<div class="wrapper">
  <div class="welcome-card">
    <img src="/welcome-img.png" alt="" class="welcome-card__image" />

    <h2 class="welcome-card__title">Теперь доступны аудио- и видеозвонки</h2>

    <p class="welcome-card__description">
      Теперь вы можете совершать звонки и присоединяться к ним в Astusha Messenger
    </p>

    <button tuiButton type="button" size="s">Перейти на вкладку «Звонки»</button>
  </div>

  <div class="buttons">
    <div class="item">
      <button
        tuiIconButton
        type="button"
        appearance="secondary"
        iconStart="@tui.file-text"
        class="button-round"
        aria-label="Отправить документ"
      ></button>

      <span class="description">Отправить документ</span>
    </div>

    <div class="item">
      <button
        tuiIconButton
        type="button"
        appearance="secondary"
        iconStart="@tui.user-plus"
        class="button-round"
        aria-label="Добавить контакт"
      ></button>

      <span class="description">Добавить контакт</span>
    </div>

    <div class="item">
      <button
        tuiIconButton
        type="button"
        appearance="secondary"
        iconStart="@tui.video"
        class="button-round"
        aria-label="Новый звонок"
      ></button>

      <span class="description">Новый звонок</span>
    </div>
  </div>
</div>
