<div class="wrapper">
  <header class="header">
    <h2 class="header__title">Новый чат</h2>

    <button tuiButtonX type="button" aria-label="Закрыть" (click)="context.complete()"></button>
  </header>

  <main class="main">
    <app-search-users [formControl]="userControl" />

    <button
      tuiButton
      type="button"
      [loading]="isCreating()"
      [disabled]="userControl.invalid || isCreating()"
      (click)="createChat()"
    >
      Начать чат
    </button>
  </main>
</div>
