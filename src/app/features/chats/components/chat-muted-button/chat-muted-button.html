<button
  [iconStart]="chat().settings.isMuted ? '@tui.bell' : '@tui.bell-off'"
  size="m"
  tuiOption
  tuiDropdownAlign="end"
  type="button"
  [tuiDropdown]="dropdown"
  [tuiDropdownSided]="true"
  [(tuiDropdownOpen)]="open"
>
  Без звука
</button>
<ng-template #dropdown let-close>
  <tui-data-list>
    <tui-opt-group>
      @for (item of items; track item) {
        <button tuiOption type="button" (click)="onClick()">
          {{ item }}
        </button>
      }
    </tui-opt-group>
    <hr />
    <tui-opt-group>
      <button tuiOption type="button" (click)="close()">Nevermind</button>
    </tui-opt-group>
  </tui-data-list>
</ng-template>
